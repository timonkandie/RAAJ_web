<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Services | RAAJ Studios</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/forms.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container section" style="padding-top: 140px;">
    <div data-component="section-title"
         data-badge="OUR SERVICES"
         data-title="Comprehensive Graphic Design Solutions"
         data-highlight="Design Solutions"
         data-subtitle="From bespoke logo mark creation to print-ready packaging artwork and corporate stationery.">
    </div>

    <div class="grid grid-3-col" style="margin-top: 3rem;">
      <div data-component="service-card"
           data-icon="🎨"
           data-title="Logo Design & Branding"
           data-description="Custom vector logos, visual guidelines, color palettes, and typography hierarchy that define your brand."
           data-software="Illustrator, Photoshop, Figma"
           data-url="hire.html?service=logo"
           data-cta="Order Logo Design">
      </div>

      <div data-component="service-card"
           data-icon="🖼️"
           data-title="Poster Design"
           data-description="High-impact event posters, promotional artwork, and creative digital displays designed to capture attention."
           data-software="Photoshop, Illustrator"
           data-url="hire.html?service=poster"
           data-cta="Order Posters">
      </div>

      <div data-component="service-card"
           data-icon="📄"
           data-title="Flyer Design"
           data-description="Sleek single or multi-page marketing flyers for business promotions, product launches, and corporate events."
           data-software="InDesign, Illustrator"
           data-url="hire.html?service=flyer"
           data-cta="Order Flyers">
      </div>

      <div data-component="service-card"
           data-icon="📦"
           data-title="Packaging Design"
           data-description="Product labels, box packaging, and die-line artwork engineered for retail shelves and unboxing experiences."
           data-software="3D Mockup, Illustrator"
           data-url="hire.html?service=packaging"
           data-cta="Order Packaging">
      </div>

      <div data-component="service-card"
           data-icon="📇"
           data-title="Business Cards"
           data-description="Premium luxury business cards, foil stamping accents, and embossed print-ready brand collateral."
           data-software="Illustrator, Photoshop"
           data-url="hire.html?service=cards"
           data-cta="Order Cards">
      </div>
    </div>
  </main>
  <div id="footer"></div>
</body>
</html>
