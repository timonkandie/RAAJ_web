    <section class="section" style="padding-top: 140px; padding-bottom: 40px;">

    </section>

    <!-- Filter (Visual only for now) -->
    <section class="reveal" style="padding-bottom: 2rem;">
      <div class="container" style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">

        <button class="btn btn-secondary">Print</button>

    </section>

    <section class="section reveal" style="padding-top: 0;">

        <div class="grid grid-3-col">

               data-title="Nairobi Music Fest Artwork"
               data-client="Nairobi Fest"
               data-category="Poster & Event"

          </div>

          <div data-component="portfolio-card"
               data-title="Apex Capital Identity"
               data-client="Apex Capital Kenya"
               data-category="Corporate Branding"
               data-slug="apex-capital"

               data-title="Zenith Coffee Roasters"
               data-client="Zenith Cafe"
               data-category="Packaging"

               data-title="Lumiere Tech Launch"
               data-client="Lumiere Tech"
               data-category="Digital & Social"
               data-slug="lumiere-tech"
