<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Blog & Insights | RAAJ Studios</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container section" style="padding-top: 140px;">
    <div data-component="section-title"
         data-badge="DESIGN INSIGHTS"
         data-title="Latest Articles & Design Trends"
         data-highlight="Design Trends"
         data-subtitle="Tips on visual branding, logo design principles, packaging trends, and marketing artwork.">
    </div>

    <div class="grid grid-3-col" style="margin-top: 3rem;">
      <div data-component="blog-card"
           data-title="5 Principles of Iconic Logo Design in 2026"
           data-excerpt="Discover how vector simplicity, memorable silhouettes, and versatile scaling create timeless brand logos."
           data-date="2026-07-28"
           data-category="Branding"
           data-image="https://images.unsplash.com/photo-1542744094-3a3172720a8a?w=800&auto=format&fit=crop"
           data-readtime="4 min read">
      </div>

      <div data-component="blog-card"
           data-title="How High-Impact Posters Boost Event Sales"
           data-excerpt="Color contrast, typography hierarchy, and visual focal points that convert event scrollers into ticket buyers."
           data-date="2026-07-20"
           data-category="Posters"
           data-image="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&auto=format&fit=crop"
           data-readtime="6 min read">
      </div>

      <div data-component="blog-card"
           data-title="The Anatomy of Winning Packaging Design"
           data-excerpt="Unboxing psychology, shelf appeal, and eco-friendly print materials that make customers fall in love."
           data-date="2026-07-15"
           data-category="Packaging"
           data-image="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop"
           data-readtime="5 min read">
      </div>
    </div>
  </main>
  <div id="footer"></div>
</body>
</html>
