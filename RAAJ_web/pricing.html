           data-period="/ project"
           data-description="Ideal for new startups and small businesses needing a professional brand foundation."

           data-url="hire.html?package=starter">

           data-title="Pro Brand Identity"
           data-price="KES 35,000"

           data-cta="Choose Pro"
           data-url="hire.html?package=pro">

      <div data-component="pricing-card"
           data-title="Custom Studio Retainer"
           data-price="KES 60,000"
           data-period="/ month"
           data-description="Dedicated monthly creative team for ongoing marketing collateral, posters, and collateral."
