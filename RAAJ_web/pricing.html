<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Packages | RAAJ Studios</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/forms.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container section" style="padding-top: 140px;">
    <div data-component="section-title"
         data-badge="TRANSPARENT PRICING"
         data-title="Simple & Flexible Design Packages"
         data-highlight="Flexible Design Packages"
         data-subtitle="No hidden fees. Choose a package that fits your budget or request a custom quote.">
    </div>

    <div class="grid grid-3-col" style="margin-top: 3rem;">
      <div data-component="pricing-card"
           data-title="Starter Identity"
           data-price="KES 15,000"
           data-period="/ project"
           data-description="Ideal for new startups and small businesses needing a professional brand foundation."
           data-features="Primary Vector Logo, Secondary Mark, Color Palette, Typography Hierarchy, High-Res PNG/SVG Files"
           data-popular="false"
           data-cta="Choose Starter"
           data-url="hire.html?package=starter">
      </div>

      <div data-component="pricing-card"
           data-title="Pro Brand Identity"
           data-price="KES 35,000"
           data-period="/ project"
           data-description="Complete brand suite with packaging, stationery, and social media artwork templates."
           data-features="Everything in Starter, Brand Style Guide PDF, Business Card Artwork, Packaging / Label Art, 3D Rendered Mockups, Source Files (AI/PSD)"
           data-popular="true"
           data-cta="Choose Pro"
           data-url="hire.html?package=pro">
      </div>

      <div data-component="pricing-card"
           data-title="Custom Studio Retainer"
           data-price="KES 60,000"
           data-period="/ month"
           data-description="Dedicated monthly creative team for ongoing marketing collateral, posters, and collateral."
           data-features="Unlimited Graphic Requests, Priority 24-48h Delivery, Posters / Flyers / Banners, Social Media Campaigns, Dedicated Account Lead"
           data-popular="false"
           data-cta="Contact for Retainer"
           data-url="contact.html">
      </div>
    </div>
  </main>
  <div id="footer"></div>
</body>
</html>
