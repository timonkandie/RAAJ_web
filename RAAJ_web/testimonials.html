<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Reviews | RAAJ Studios</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container section" style="padding-top: 140px;">
    <div data-component="section-title"
         data-badge="CLIENT REVIEWS"
         data-title="What Clients Say About RAAJ Studios"
         data-highlight="About RAAJ Studios"
         data-subtitle="Read feedback from founders, event managers, and business leads who trust RAAJ Studios.">
    </div>

    <div class="grid grid-3-col" style="margin-top: 3rem;">
      <div data-component="testimonial-card"
           data-quote="RAAJ Studios completely transformed our brand identity. The logo and packaging design helped us gain national retail distribution!"
           data-name="Mercy Wanjiku"
           data-role="Founder"
           data-company="Sawa Organics"
           data-rating="5">
      </div>

      <div data-component="testimonial-card"
           data-quote="Fast turnaround, incredible attention to detail, and top-tier vector precision. Our event posters generated record ticket sales."
           data-name="David Ochieng"
           data-role="Creative Director"
           data-company="Nairobi Fest"
           data-rating="5">
      </div>

      <div data-component="testimonial-card"
           data-quote="The most professional design agency in Nairobi. Their pricing packages are transparent and the output is world-class."
           data-name="Sarah Amina"
           data-role="Marketing Lead"
           data-company="Apex Capital"
           data-rating="5">
      </div>
    </div>
  </main>
  <div id="footer"></div>
</body>
</html>
